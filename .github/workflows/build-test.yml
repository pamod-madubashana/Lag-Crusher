name: Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run tests
        run: bun run test
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/test-key.jks
          ls -la $GITHUB_WORKSPACE/test-key.jks
          file $GITHUB_WORKSPACE/test-key.jks
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Init Android project
        run: cargo tauri android init
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/test-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cargo tauri android build
      - name: Sign APK with apksigner
        run: |
          UNSIGNED_APK=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          KEYSTORE_PATH="${{ github.workspace }}/test-key.jks"
          KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

          # Create build-tools path
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          # Zipalign first
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          ALIGNED_APK=$(echo "$UNSIGNED_APK" | sed 's/-unsigned/-aligned/')
          "$ZIPALIGN" -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          echo "Aligned APK: $ALIGNED_APK"

          # Sign with apksigner
          SIGNED_APK=$(echo "$UNSIGNED_APK" | sed 's/-unsigned//')
          "$APKSIGNER" sign --ks "$KEYSTORE_PATH" --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$SIGNED_APK" "$ALIGNED_APK"
          echo "Signed APK: $SIGNED_APK"

          # Verify
          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          ls -la "$SIGNED_APK"
      - name: Prepare test artifacts
        run: |
          mkdir -p test-artifacts
          SIGNED_APK=$(find src-tauri/gen/android -name "*-release.apk" ! -name "*unsigned*" | head -1)
          cp "$SIGNED_APK" test-artifacts/LagCrusher-test.apk
          AAB=$(find src-tauri/gen/android -name "*.aab" | head -1)
          cp "$AAB" test-artifacts/LagCrusher-test.aab
          ls -la test-artifacts/
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-test
          path: test-artifacts/
